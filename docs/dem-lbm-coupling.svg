<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="monospace" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold">FluidX3D-DEM: Two-Way Coupled Simulation</text>

  <!-- LBM Box -->
  <rect x="40" y="60" width="370" height="400" rx="10" fill="#161b22" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="88" text-anchor="middle" fill="#2563eb" font-size="15" font-weight="bold">FluidX3D (GPU, OpenCL)</text>

  <!-- LBM Steps -->
  <rect x="70" y="105" width="310" height="40" rx="6" fill="#1c2333" stroke="#3b82f6" stroke-width="1"/>
  <text x="225" y="130" text-anchor="middle" fill="#93c5fd">LBM Collision + Streaming</text>

  <rect x="70" y="170" width="310" height="40" rx="6" fill="#1c2333" stroke="#3b82f6" stroke-width="1"/>
  <text x="225" y="195" text-anchor="middle" fill="#93c5fd">Velocity Field u(x,t)</text>

  <rect x="70" y="310" width="310" height="40" rx="6" fill="#1c2333" stroke="#ef4444" stroke-width="1"/>
  <text x="225" y="335" text-anchor="middle" fill="#fca5a5">Force Field F(x,t)</text>

  <rect x="70" y="375" width="310" height="40" rx="6" fill="#1c2333" stroke="#3b82f6" stroke-width="1"/>
  <text x="225" y="400" text-anchor="middle" fill="#93c5fd">Guo Forcing Scheme</text>

  <!-- LBM internal arrows -->
  <line x1="225" y1="145" x2="225" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="350" x2="225" y2="373" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="225" y1="415" x2="225" y2="438" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Loop back arrow -->
  <path d="M 225 440 L 225 450 L 55 450 L 55 125 L 68 125" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="56" y="295" fill="#8b949e" font-size="11" transform="rotate(-90, 56, 295)">next timestep</text>

  <!-- DEM Box -->
  <rect x="490" y="60" width="370" height="400" rx="10" fill="#161b22" stroke="#22c55e" stroke-width="2"/>
  <text x="675" y="88" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="bold">DEM Particles (CPU)</text>

  <!-- DEM Steps -->
  <rect x="520" y="105" width="310" height="40" rx="6" fill="#1c2333" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="130" text-anchor="middle" fill="#86efac">Injection + Collision Detection</text>

  <rect x="520" y="170" width="310" height="40" rx="6" fill="#1c2333" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="195" text-anchor="middle" fill="#86efac">Trilinear Velocity Interpolation</text>

  <rect x="520" y="235" width="310" height="40" rx="6" fill="#1c2333" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="253" text-anchor="middle" fill="#86efac">Drag (Schiller-Naumann)</text>
  <text x="675" y="268" text-anchor="middle" fill="#86efac">+ Contact + Gravity</text>

  <rect x="520" y="300" width="310" height="40" rx="6" fill="#1c2333" stroke="#4ade80" stroke-width="1"/>
  <text x="675" y="325" text-anchor="middle" fill="#86efac">Velocity Verlet Integration</text>

  <rect x="520" y="365" width="310" height="40" rx="6" fill="#1c2333" stroke="#ef4444" stroke-width="1"/>
  <text x="675" y="383" text-anchor="middle" fill="#fca5a5">Reaction Force -Fd</text>
  <text x="675" y="398" text-anchor="middle" fill="#fca5a5">(Newton's 3rd Law)</text>

  <!-- DEM internal arrows -->
  <line x1="675" y1="145" x2="675" y2="168" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="210" x2="675" y2="233" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="275" x2="675" y2="298" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="340" x2="675" y2="363" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Coupling arrows -->
  <!-- Velocity: LBM -> DEM (blue, forward) -->
  <path d="M 382 190 L 518 190" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="450" y="183" text-anchor="middle" fill="#60a5fa" font-size="11">GPU -> CPU</text>

  <!-- Force: DEM -> LBM (red, backward) -->
  <path d="M 518 385 L 382 330" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="450" y="346" text-anchor="middle" fill="#f87171" font-size="11">CPU -> GPU</text>

  <!-- Combined rendering label -->
  <rect x="250" y="475" width="400" height="35" rx="8" fill="#1c2333" stroke="#a855f7" stroke-width="1.5"/>
  <text x="450" y="498" text-anchor="middle" fill="#c084fc" font-size="14" font-weight="bold">Combined Rendering (Fluid + Particles)</text>
</svg>
